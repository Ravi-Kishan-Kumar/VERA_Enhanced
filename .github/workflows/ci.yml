name: CI

on:
  pull_request:
    branches: [main]
  workflow_call: # reused by deploy.yml on pushes to main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite:///./ci.db
      REDIS_URL: redis://localhost:6379/0
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt \
                      -r backend/requirements-lint.txt \
                      -r backend/requirements-test.txt

      - name: Lint
        run: |
          ruff check backend training
          black --check backend training

      - name: Type check
        run: mypy backend/app training/vera_training

      - name: Test
        run: pytest -v --tb=short

      - name: Migrations apply cleanly from scratch (and roll back)
        working-directory: backend
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      - name: No torch/transformers in production requirements
        run: "! grep -Ei '^(torch|transformers|mapie)' backend/requirements.txt"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
        env:
          API_URL: http://127.0.0.1:8000

  playwright:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --workers=1
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-failures
          path: frontend/test-results/
          retention-days: 7

  space-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check POSIX entrypoint syntax
        run: sh -n deploy/huggingface-space/start.sh
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/huggingface-space/Dockerfile
          push: false
          tags: vera-space:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install pip-audit
      - name: Python dependency report (no automatic fixes)
        id: pip-audit
        continue-on-error: true
        run: pip-audit -r backend/requirements.txt --format=json --output=pip-audit.json
      - run: npm ci --ignore-scripts
        working-directory: frontend
      - name: Frontend production dependency report (no automatic fixes)
        id: npm-audit
        continue-on-error: true
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high --json > ../npm-audit.json
      - name: Record audit outcomes for manual triage
        if: always()
        env:
          PIP_OUTCOME: ${{ steps.pip-audit.outcome }}
          NPM_OUTCOME: ${{ steps.npm-audit.outcome }}
        run: |
          echo "### Dependency scans (report-only)" >> "$GITHUB_STEP_SUMMARY"
          echo "pip-audit: $PIP_OUTCOME; npm audit: $NPM_OUTCOME" >> "$GITHUB_STEP_SUMMARY"
          echo "Review attached reports. A failed scan may mean findings or a scanner/network error; it is not a clean bill of health." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-audits
          path: |
            pip-audit.json
            npm-audit.json
          if-no-files-found: warn
          retention-days: 14

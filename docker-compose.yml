# -----------------------------------------------------------------------------
# OPTIONAL local infrastructure (PRD §4.6).
#
# The default setup uses Supabase (Postgres) + Upstash (Redis) — no Docker
# needed. Use this file only if you prefer local containers:
#
#   docker compose up -d                 # postgres + redis only
#   docker compose --profile app up -d   # also api + worker (needs data/models)
#
# Then point .env at:
#   DATABASE_URL=postgresql://vera:vera@localhost:5432/vera
#   REDIS_URL=redis://localhost:6379/0
# -----------------------------------------------------------------------------
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vera
      POSTGRES_PASSWORD: vera
      POSTGRES_DB: vera
    ports:
      - "5432:5432"
    volumes:
      - vera_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vera -d vera"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    profiles: ["app"]
    build:
      context: .
      dockerfile: Dockerfile.backend
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql://vera:vera@db:5432/vera
      REDIS_URL: redis://redis:6379/0
      MODEL_DIR: /models
    volumes:
      - ./data/models:/models:ro
    ports:
      - "8000:8000"
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }

  worker:
    profiles: ["app"]
    build:
      context: .
      dockerfile: Dockerfile.backend
    command: celery -A app.worker.celery_app worker --loglevel=info --pool=solo
    env_file: .env
    environment:
      DATABASE_URL: postgresql://vera:vera@db:5432/vera
      REDIS_URL: redis://redis:6379/0
      MODEL_DIR: /models
    volumes:
      - ./data/models:/models:ro
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }

volumes:
  vera_pg:
